# `trustPolicy: no-downgrade` NAO foi aplicado, e a supressao fica aqui porque
# a regra ancora o achado na linha `packages:` — o nosemgrep so vale na mesma
# linha ou na imediatamente anterior.
#
# Ele funciona, e e justamente esse o problema: rejeita 6 entradas do lockfile
# atual (chokidar, eslint-import-resolver-typescript, semver, tailwind-merge,
# undici-types e vite) como possivel tomada de pacote, e derruba o
# `pnpm install --frozen-lockfile`. Liga-lo exige reconstruir o lockfile do
# zero e revalidar build, testes, imagem e os tres deploys — mudanca grande
# demais para entrar sem janela de teste.
#
# Registrado em docs/observacoes.md, achado 2.3, com plano.
# nosemgrep: package_managers.pnpm.pnpm-trust-policy.pnpm-trust-policy
packages:
  - "apps/*"
  - "packages/*"

# Defesas de cadeia de suprimentos, apontadas pelo Semgrep na Etapa 2.
#
# blockExoticSubdeps: impede que uma dependência transitiva seja puxada de
#   fonte exótica (git, tarball por URL, link local). É por aí que entra
#   pacote que não passa pelo registro e, portanto, por nenhuma varredura.
#
# minimumReleaseAge: ignora versão publicada há menos de 7 dias (10080
#   minutos). Ataque de conta de mantenedor comprometida costuma ser descoberto
#   e a versão despublicada em dias. O primeiro valor tentado foi 1440 (24h), e
#   a regra continuou acusando: ela exige no mínimo 10080.
#
blockExoticSubdeps: true
minimumReleaseAge: 10080

# A partir do pnpm 10 estes ajustes moraram do package.json para cá.
#
# postcss e nanoid: correções de XSS e path traversal via sourceMappingURL.
# sharp: vulnerabilidades herdadas do libvips. É dependência opcional do Next
#   para next/image, que nenhum dos apps usa — o override só evita que o
#   `pnpm audit` acuse, sem forçar migração de major.
#
# `pnpm audit --prod` deve reportar zero. Se voltar a acusar, é aqui que se mexe.
overrides:
  postcss: ^8.5.23
  nanoid: ^3.3.17
  # 0.35.4 corrige a falha herdada do libvips que o audit apontava em <0.35.4.
  sharp: ^0.35.4
  # Transitivas que o NestJS 11 ainda arrasta em versão vulnerável.
  # qs precisa de 6.16.0: as falhas cobrem tudo abaixo disso.
  qs: ^6.16.0
  # multer vem do @nestjs/platform-express. A API não recebe upload de arquivo
  # em lugar nenhum, mas o audit acusa mesmo assim.
  multer: ^2.4.0
  body-parser: ^1.20.6

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - esbuild
